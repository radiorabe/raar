name: Build

on:
  push:
    branches:
      - main
  pull_request:

env:
  RAAR_DB_ADAPTER: postgresql
  RAAR_DB_HOST: localhost
  RAAR_DB_NAME: raar_test
  RAAR_DB_USERNAME: postgres
  RAAR_DB_PASSWORD: postgres
  AIRTIME_DB_ADAPTER: postgresql
  AIRTIME_DB_HOST: localhost
  AIRTIME_DB_NAME: airtime_test
  AIRTIME_DB_USERNAME: postgres
  AIRTIME_DB_PASSWORD: postgres
  PARALLEL_WORKERS: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.0", "3.1"]
    permissions:
      contents: read

    services:
      db:
        image: postgres:11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup-ruby
        name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby-version || 'default' }} # 'default' reads .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Prepare
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          psql -c 'create database raar_test;' -U $RAAR_DB_USERNAME -h $RAAR_DB_HOST
          psql -c 'create database airtime_test;' -U $RAAR_DB_USERNAME -h $RAAR_DB_HOST
      - name: Run tests
        run: bundle exec rails test
      - name: Coveralls
        if: matrix.ruby-version == '3.0'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./test/coverage/lcov.info"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *setup-ruby
      - name: Run rubocop
        run: bundle exec rubocop
